name: Build welcome and screensaver candidate
on:
  push:
    branches: [feature/welcome-screensaver]
    paths: [source/welcome-screensaver.zip, .github/workflows/build-appearance.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Extract candidate source
        run: unzip -q source/welcome-screensaver.zip -d firmware-src
      - name: Install pinned build tools
        run: python -m pip install -r firmware-src/requirements-build.txt
      - uses: actions/cache/restore@v4
        id: pio-cache
        with:
          path: |
            ~/.platformio
            firmware-src/.pio
          key: owner-pio55-${{ runner.os }}-${{ github.sha }}
          restore-keys: owner-pio55-${{ runner.os }}-
      - name: Test photo conversion and release isolation
        working-directory: firmware-src
        run: |
          g++ -std=c++17 -Iinclude test_native/machine_settings.cpp src/xbloom_protocol.cpp -o /tmp/machine-settings-test
          /tmp/machine-settings-test
          g++ -std=c++17 -Iinclude test_native/machine_settings_read.cpp src/xbloom_protocol.cpp -o /tmp/machine-read-test
          /tmp/machine-read-test
          g++ -std=c++17 -Itests/ota_boot -Iinclude tests/ota_boot/test.cpp src/ota_boot.cpp -o /tmp/ota-boot-test
          /tmp/ota-boot-test
          g++ -std=c++17 -Itests/ring_light -Iinclude tests/ring_light/test.cpp src/ring_light.cpp -o /tmp/ring-test
          /tmp/ring-test
          g++ -std=c++17 -DPANEL_SPOTIFY_TRIAL=1 -Iinclude -I.pio/libdeps/crowpanel-advance-43-pilot/ArduinoJson/src tests/test_spotify_engine.cpp src/spotify_engine.cpp -o /tmp/spotify-test
          /tmp/spotify-test
          python -m unittest discover -s tests -p test_spotify_link.py -v
          node tests/test_spotify_callback.cjs
          node tests/test_wallpaper_web.cjs
          python -m unittest discover -s tests -p test_customer_release.py -v
          python -m unittest discover -s tests -p test_build_spawn.py -v
          g++ -std=c++17 -Iinclude tests/test_screen_preferences.cpp -o /tmp/screen-test
          /tmp/screen-test
          g++ -std=c++17 -Itests/wallpaper_mocks -Iinclude tests/test_wallpaper.cpp src/wallpaper.cpp -o /tmp/photo-test
          /tmp/photo-test
          g++ -std=c++17 -c -Iinclude tests/test_update_policy.cpp -o /tmp/customer-policy.o
          g++ -std=c++17 -c -DPANEL_PILOT_ACCESS=1 -Iinclude tests/test_update_policy.cpp -o /tmp/owner-policy.o
      - name: Build owner firmware
        working-directory: firmware-src
        run: pio run -e crowpanel-advance-43-pilot -j 2
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: |
            ~/.platformio
            firmware-src/.pio
          key: owner-pio55-${{ runner.os }}-${{ github.sha }}
      - name: Build and test actual UI
        working-directory: firmware-src
        run: |
          cmake -S sim -B sim-build -DLVGL_DIR="$PWD/.pio/libdeps/crowpanel-advance-43-pilot/lvgl" -DARDUINOJSON_DIR="$PWD/.pio/libdeps/crowpanel-advance-43-pilot/ArduinoJson" -DFW_VERSION=3.5.11 -DPANEL_PILOT_ACCESS=ON -DPANEL_SPOTIFY_TRIAL=ON
          cmake --build sim-build -j 2
          ./sim-build/sim appearance-test
          ./sim-build/sim machine-test
          ./sim-build/sim spotify-test
      - name: Verify candidate identity
        working-directory: firmware-src
        run: |
          mkdir -p candidate
          python scripts/prepare_panel_release.py pilot candidate --image .pio/build/crowpanel-advance-43-pilot/firmware.bin --notes "Separate Machine and Screen tabs. Apps keeps Spotify and lighting. Verified navigation and machine readback. Stable channel unchanged."
          cp .pio/build/crowpanel-advance-43-pilot/firmware.factory.bin candidate/xbloom-saud-3.5.11-full-usb.bin
          cp *.ppm candidate/
      - uses: actions/upload-artifact@v4
        with:
          name: xbloom-owner-3.5.11-candidate
          path: firmware-src/candidate
          if-no-files-found: error

