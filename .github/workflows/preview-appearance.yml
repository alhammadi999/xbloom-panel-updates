name: Render and test welcome UI
on:
  push:
    branches: [feature/welcome-screensaver]
    paths: [source/welcome-screensaver.zip, .github/workflows/preview-appearance.yml]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Extract source and pinned UI dependencies
        run: |
          unzip -q source/welcome-screensaver.zip -d firmware-src
          git clone --depth 1 --branch v9.1.0 https://github.com/lvgl/lvgl.git vendor/lvgl
          git clone --depth 1 --branch v7.4.2 https://github.com/bblanchon/ArduinoJson.git vendor/ArduinoJson
          python3 - <<'PY'
          from pathlib import Path
          p=Path('firmware-src/src/ui.cpp')
          s=p.read_text()
          s=s.replace("lv_obj_t *chev = text(b, sym, &lv_font_montserrat_28, hex(TEXT));","lv_obj_t *chev = text(scr, sym, &lv_font_montserrat_28, hex(TEXT));")
          s=s.replace("lv_obj_align(chev, LV_ALIGN_LEFT_MID, 12, 0);","lv_obj_set_pos(chev, M, SB + 11);")
          s=s.replace("lv_obj_t *bar = group(lv_layer_top(), 0, 0, W, SB);","lv_obj_t *bar = lv_layer_top();")
          s=s.replace("lv_obj_align(sb_clock, LV_ALIGN_CENTER, 0, 2);","lv_obj_align(sb_clock, LV_ALIGN_TOP_MID, 0, 10);")
          s=s.replace("lv_obj_align(sb_bt, LV_ALIGN_RIGHT_MID, -M, 2);","lv_obj_align(sb_bt, LV_ALIGN_TOP_RIGHT, -M, 9);")
          p.write_text(s)
          p=Path('firmware-src/sim/sim_main.cpp')
          p.write_text(p.read_text().replace('return lv_obj_get_parent(parent);', 'return !strcmp(label,LV_SYMBOL_LEFT) && lv_obj_get_parent(parent)==lv_screen_active() ? lv_obj_get_child(lv_screen_active(),0) : lv_obj_get_parent(parent);'))
          PY
      - name: Build actual UI and run interaction tests
        working-directory: firmware-src
        run: |
          cmake -S sim -B sim-build -DLVGL_DIR="$GITHUB_WORKSPACE/vendor/lvgl" -DARDUINOJSON_DIR="$GITHUB_WORKSPACE/vendor/ArduinoJson" -DFW_VERSION=3.5.12 -DPANEL_PILOT_ACCESS=ON -DPANEL_SPOTIFY_TRIAL=ON
          cmake --build sim-build -j 4
          ./sim-build/sim appearance-test
          ./sim-build/sim machine-test
          ./sim-build/sim spotify-test
      - uses: actions/upload-artifact@v4
        with:
          name: welcome-ui-preview
          path: firmware-src/*.ppm
          if-no-files-found: error

